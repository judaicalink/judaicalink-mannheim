# A local test VM for the platform (Lima on macOS): Ubuntu Server 26.04 LTS, set up with host/install.sh like
# the real VM. The site is then at https://localhost (self-signed certificate).
#   limactl start --name=mannheim host/local-vm.yaml
#   limactl shell mannheim            # a shell in the VM;  limactl stop|delete mannheim
# Only this repository is visible in the VM (read-only, at the same path); it is copied to /data/mannheim/src there.
minimumLimaVersion: 2.0.0
base: template:_images/ubuntu-26.04
vmType: vz
cpus: 4
memory: 12GiB
disk: 60GiB
mounts:
  - location: "~/sync/projekte/judaicalink/judaicalink-mannheim"   # this repository; adjust to your checkout
    writable: false
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 80
    hostIP: 127.0.0.1
    hostPort: 80
  - guestPort: 443
    hostIP: 127.0.0.1
    hostPort: 443
  - guestPortRange: [1, 65535]       # nothing else of the VM is reachable from the Mac
    ignore: true
