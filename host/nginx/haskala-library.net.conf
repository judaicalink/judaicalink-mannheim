# haskala-library.net, the former site of the Library of Haskala (Drupal, offline since 2025), and its www name:
# every old address is redirected to its page in the showcase /haskala/ (decision 0010), whose paths are the old
# ones (jlma-haskala decision 0002). Installed by host/install.sh, with a certificate of its own.

# the path below /haskala/: the old path as a directory, without query and trailing slashes; the one renamed
# path, "alignment of text" with no-break spaces, is alignment-of-text; anything else odd goes to the start page
map $request_uri $haskala_library_path {
    default /;
    "~*^/alignment(?:%C2%A0|%20|\xC2\xA0)of(?:%C2%A0|%20|\xC2\xA0)text(?<hk_rest>(?:/[^/?]+)*)/*(?:\?.*)?$" /alignment-of-text$hk_rest/;
    "~^(?<hk_path>(?:/[^/?]+)*)/*(?:\?.*)?$" $hk_path/;
}

server {
    listen 80;
    listen [::]:80;
    server_name haskala-library.net www.haskala-library.net;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mannheim.judaicalink.org/haskala$haskala_library_path; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haskala-library.net www.haskala-library.net;
    server_tokens off;

    # links to the Let's Encrypt certificate, or to a self-signed one on a local test VM (host/install.sh)
    ssl_certificate     /etc/nginx/tls-haskala-library.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls-haskala-library.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 301 https://mannheim.judaicalink.org/haskala$haskala_library_path; }
}
