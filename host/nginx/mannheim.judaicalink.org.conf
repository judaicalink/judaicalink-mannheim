# nginx on the host: the only public entry of mannheim.judaicalink.org (installed by host/install.sh).
# Static site and static showcases from /data/mannheim/www, the dumps from /data/mannheim/store, SPARQL and
# showcases with a server from containers on 127.0.0.1. The showcase locations are generated from
# site/data/showcases.toml by host/nginx/showcases.py into /etc/nginx/mannheim-showcases/.

limit_req_zone $binary_remote_addr zone=jl_sparql:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mannheim.judaicalink.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mannheim.judaicalink.org;

    # links to the Let's Encrypt certificate, or to a self-signed one on a local test VM (host/install.sh)
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # the platform bar: pages contain <!--# include virtual="/kit/1/header.html" -->, which nginx replaces (SSI);
    # applies to HTML only, from files and from showcase containers alike
    ssi on;

    root /data/mannheim/www/site;
    location / { try_files $uri $uri/ =404; }

    # a dumps location (decision 0019): the files of the loaded versions, <slug>/<version>/<path>
    location /dumps/ {
        alias /data/mannheim/store/;
        autoindex on;
    }

    # the SPARQL endpoint, query only (the Fuseki service has no update, upload or admin endpoints)
    location = /sparql {
        limit_req zone=jl_sparql burst=30 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }   # OPTIONS: CORS preflight, answered by Fuseki
        client_max_body_size 1m;
        ssi off;
        proxy_pass http://127.0.0.1:3030/judaicalink/query;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;               # Fuseki stops a query after 120 s (services/fuseki/config.ttl)
    }

    include /etc/nginx/mannheim-showcases/*.conf;
}
