# The central services of mannheim.judaicalink.org. Run in this directory: docker compose up -d
# Settings in .env (see .env.example); the current database is FUSEKI_DB, set by load.sh.
# Nothing here is published beyond 127.0.0.1: nginx on the host is the only public entry (../host/nginx/).
name: judaicalink

services:
  # the public SPARQL endpoint, read-only (fuseki/config.ttl); nginx passes /sparql to /judaicalink/query
  fuseki:
    build: ./fuseki
    image: judaicalink/fuseki:6.2.0
    restart: unless-stopped
    command: ["--conf", "/fuseki/config.ttl"]
    environment:
      JAVA_OPTS: "-Xmx${FUSEKI_HEAP:-8g}"
    volumes:
      - ./fuseki/config.ttl:/fuseki/config.ttl:ro
      - type: bind                   # never create a missing database directory: fail instead
        source: ${FUSEKI_DB:?set FUSEKI_DB in .env (load.sh does)}
        target: /fuseki/database
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:3030:3030"
    networks: [judaicalink]

  # builds a new database over HTTP (load.sh); never public, not on the shared network, stopped after loading
  fuseki-load:
    image: judaicalink/fuseki:6.2.0
    profiles: [load]
    command: ["--update", "--loc", "/fuseki/database", "/judaicalink"]
    environment:
      JAVA_OPTS: "-Xmx${FUSEKI_HEAP:-8g}"
    volumes:
      - type: bind
        source: ${FUSEKI_LOAD_DB:-/nonexistent}
        target: /fuseki/database
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:3031:3030"

  # Solr for the platform and the showcases: each owns its cores (created over the API by its indexer, from the
  # _default configset, fields defined with the Schema API); reachable as http://solr:8983/solr on the network
  solr:
    image: solr:9.10.1
    restart: unless-stopped
    # standalone Solr finds configsets only in its home: copy the one that comes with Solr there before starting
    command: ["bash", "-c", "init-var-solr && mkdir -p /var/solr/data/configsets && cp -rn /opt/solr/server/solr/configsets/_default /var/solr/data/configsets/ && exec solr-foreground"]
    environment:
      SOLR_HEAP: "${SOLR_HEAP:-4g}"
    volumes:
      - type: bind
        source: ${DATA:-/data/mannheim}/solr
        target: /var/solr
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:8983:8983"
    networks: [judaicalink]

  # the platform's application: IRI views (/data/, /datasets/, /ontology/), graph search (/search/); its jobs
  # (search index, dashboard, figures of the graph) run in the same image: docker compose run --rm graph python3 jobs.py …
  graph:
    build: ../apps/graph
    image: judaicalink/graph:latest
    restart: unless-stopped
    environment:
      JL_SPARQL: http://fuseki:3030/internal/query
      JL_SOLR: http://solr:8983/solr
      JL_GENERATED: /generated
      JL_REGISTRY: /registry/showcases.toml
    volumes:
      - ../site/data/showcases.toml:/registry/showcases.toml:ro
      - type: bind
        source: ${DATA:-/data/mannheim}/www/generated
        target: /generated
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs: [/tmp]
    networks: [judaicalink]

# showcases with a server join this network: http://fuseki:3030/internal/query (or /judaicalink/query), http://solr:8983/solr
networks:
  judaicalink:
    name: judaicalink
